<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"
    <title>FastAPI & Alpine Chat</title>
    <script src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js" defer></script>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 h-screen flex items-center justify-center p-4">
    <div x-data="chatApp()" x-init="init=initsocket()" class="w-full max-w-md bg-white rounded-lg shadow-md p-6 flex flex-col h-[500px]">
        <h2 class="text-xl font-bold mb-4 text-blue-600 border-none pb-0">Chat Room</h2>

        <!-- Chat Messages Window-->
        <div class="flex-1 overflow-y-auto border p-3 rounded mb-4 space-y-2 bg-gray-50">
            <template x-for="(msg, index) in messages" :key="index">
                <div class="bg-blue-100 text-blue-900 p-2 rounded max-w-[85%] text-sm" x-text="msg"></div>

            </template>
        </div> 
        
        <form @submit.prevent="sendMessage()" class="flex gap-2"
    </div>
</body>

</html>
